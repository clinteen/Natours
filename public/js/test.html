<figure class="card">
    <div class="image-details">{IMAGE}{IMAGE}</div>

    <div class="product_name_box">
        <h2 class="product_name">{PRODUCTNAME}</h2>
    </div>

    <div class="details_container">
        <div class="organic_detail_box">
            <p class="organic_detail">{ORGANIC}</p>
        </div>

        <div class="quantity_detail_box">
            <p class="quantity_detail">{QUANTITY}€<span>📦</span></p>
        </div>

        <div class="price_detail_box">
            <p class="price_detail">{PRICE}</p>
        </div>
    </div>

    <a href="/product?id={ID}">
        <div class="product_details">
            <p>Detail👉</p>
        </div>
    </a>
</figure>
